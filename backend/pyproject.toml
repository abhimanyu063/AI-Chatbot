
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-competitive-intelligence-backend"
version = "0.1.0"
description = "Retail Competitive Intelligence AI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27"
]

[tool.setuptools.packages.find]
include = ["app*"]
